name: Refresh dashboard and deploy Pages

on:
  schedule:
    # 08:00, 13:00, 18:00 and 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 0,5,10,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dashboard logic
        run: |
          node tests/test_ui.js
          python -m unittest discover -s tests -v

      - name: Collect latest 72 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf evidence
          python dashboard.py --hours 72

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html batches.csv manifest.json _site/
          touch _site/.nojekyll

      - name: Upload evidence for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-evidence-${{ github.run_id }}
          path: |
            evidence/
            batches.csv
          retention-days: 7
          if-no-files-found: warn

      - name: Save deployment verification files
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: |
            manifest.json
            quality.py
            verify_deployment.py

      - name: Report build failure
        if: failure()
        run: |
          echo "::error::Refresh failed. Previous Pages deployment is retained. Inspect collection evidence and quality-report.json."
          echo "### Dashboard refresh failed: previous successful data retained" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/download-artifact@v4
        with:
          name: deployment-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify published data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python verify_deployment.py "$PAGE_URL" manifest.json
      - name: Report verification failure
        if: failure()
        run: |
          echo "::error::Pages deployment or published-data verification failed. Inspect this run before trusting the refresh."
          echo "### Pages deployment verification failed" >> "$GITHUB_STEP_SUMMARY"
